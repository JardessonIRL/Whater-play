<style>

:root{
  --bg:#0b1020;
  --card:#151c30;
  --card2:#1d2740;
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --accent2:#fb7185;
  --good:#34d399;
  --line:#28344f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:
    linear-gradient(
      180deg,
      #0b1020,
      #111827
    );

  color:
    var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    Segoe UI,
    sans-serif;

  min-height:
    100vh;
}

.app{
  max-width:
    760px;

  margin:
    auto;

  padding:
    16px
    14px
    88px;
}

.top{
  display:flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    14px;
}

.title{
  font-size:
    20px;

  font-weight:
    800;
}

.room{
  font-size:
    12px;

  color:
    var(--muted);
}

.card{
  background:
    rgba(
      21,
      28,
      48,
      .96
    );

  border:
    1px solid
    var(--line);

  border-radius:
    18px;

  padding:
    16px;

  margin-bottom:
    14px;

  box-shadow:
    0 10px 28px
    rgba(
      0,
      0,
      0,
      .22
    );
}

.date{
  color:
    var(--muted);

  font-size:
    13px;

  margin-bottom:
    10px;

  text-align:
    center;
}

.scoregrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    12px;
}

.player{
  background:
    var(--card2);

  border:
    1px solid
    var(--line);

  border-radius:
    16px;

  padding:
    14px;

  text-align:
    center;
}

.name{
  font-size:
    14px;

  color:
    var(--muted);

  margin-bottom:
    8px;
}

.score{
  font-size:
    58px;

  line-height:
    1;

  font-weight:
    900;

  margin:
    4px 0 14px;
}


/* =========================================
   SCORE BUTTONS
   ========================================= */

.score-actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;
}

.add{
  width:
    100%;

  min-height:
    92px;

  border:
    0;

  border-radius:
    14px;

  padding:
    12px 6px;

  color:
    #04111b;

  background:
    var(--accent);

  cursor:
    pointer;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  gap:
    3px;

  font-weight:
    900;

  touch-action:
    manipulation;
}

.player:nth-child(2) .add{
  background:
    var(--accent2);
}

.add:disabled{
  opacity:
    .55;

  cursor:
    not-allowed;
}

.add-icon{
  width:
    34px;

  height:
    34px;

  display:
    block;
}

.add-icon svg{
  width:
    100%;

  height:
    100%;

  display:
    block;
}

.add-label{
  font-size:
    13px;

  font-weight:
    900;
}

.add-points{
  font-size:
    11px;

  opacity:
    .75;
}


.actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  margin-top:
    12px;
}

.btn{
  border:
    1px solid
    var(--line);

  background:
    #0f172a;

  color:
    var(--text);

  border-radius:
    12px;

  padding:
    12px;

  font-weight:
    700;

  cursor:
    pointer;
}

.danger{
  border-color:
    #7f1d1d;

  color:
    #fecaca;
}

.summary{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;
}

.metric{
  background:
    var(--card2);

  border-radius:
    14px;

  padding:
    14px;
}

.metric b{
  font-size:

}

.metric span{
  font-size:
    12px;

  color:

}

.history-item{

  justify-content:
    space-between;

  gap:
    16px;

  padding:
    12px 0;

  border-bottom:
    1px solid

}

.history-item:last-child{
  border-bottom:

}

.chart-wrap{

}

.seg{
  display:flex;

  gap:
    8px;

  margin-bottom:
    12px;
}

.seg button{
  flex:
    1;
}

.seg .active{

    var(--accent);

  color:

  border-color:
    transparent;
}

.settings label{

  font-size:
    12px;

  color:
    var(--muted);

  margin:
    10px 0 5px;
}

.settings input{
  width:
    100%;

  background:
    #0f172a;

  border:
    1px solid
    var(--line);

  color:
    var(--text);

  border-radius:
    10px;

  padding:
    12px;

  font-size:
    16px;
}

.nav{
  position:
    fixed;

  left:
    50%;

  bottom:
    0;

  transform:
    translateX(-50%);

  width:
    min(
      760px,
      100%
    );

  display:grid;

  grid-template-columns:
    repeat(
      5,
      1fr
    );

  background:
    rgba(
      11,
      16,
      32,
      .97
    );

  border-top:
    1px solid
    var(--line);

  padding:
    8px
    max(
      8px,
      env(safe-area-inset-right)
    )
    calc(
      8px
      +
      env(safe-area-inset-bottom)
    )
    max(
      8px,
      env(safe-area-inset-left)
    );

  z-index:
    10;
}

.nav button{
  background:
    none;

  border:
    0;

  color:
    var(--muted);

  font-size:
    11px;

  padding:
    8px 2px;
}

.nav button.active{
  color:
    var(--text);

  font-weight:
    800;
}

.view{
  display:
    none;
}

.view.active{
  display:
    block;
}

.status{
  text-align:
    center;

  font-size:
    12px;

  color:
    var(--muted);

  margin-top:
    8px;
}

.toast{
  position:
    fixed;

  left:
    50%;

  bottom:
    88px;

  transform:
    translateX(-50%);

  background:
    #020617;

  color:
    #fff;

  border:
    1px solid
    var(--line);

  padding:

  border-radius:
    10px;

  opacity:
    0;

  pointer-events:
    none;

  transition:
    .2s;

  z-index:
    50;
}

.toast.show{
  opacity:

}

  }

  }

  .chart-wrap{

  }

}

</style>

<script>


// =========================================
// ROOM
// =========================================

const params =
  new URLSearchParams(
    location.search
  );


const room =
  params.get(
    'room'
  )
  ||
  localStorage.getItem(
    'duel_room'
  )
  ||
  'JarAna';


localStorage.setItem(
  'duel_room',
  room
);


document
  .getElementById(
    'roomLabel'
  )
  .textContent =
    'Room: '
    +
    room;


// =========================================
// STATE
// =========================================

let state =
  null;


let ws =
  null;


let chart =
  null;


let chartMode =
  'week';


const $ =
  id =>
    document.getElementById(
      id
    );


// =========================================
// TOAST
// =========================================

function toast(
  text
){

  $('toast').textContent =
    text;


  $('toast')
    .classList
    .add(
      'show'
    );


  clearTimeout(
    toast.timer
  );


  toast.timer =
    setTimeout(
      () =>
        $('toast')
          .classList
          .remove(
            'show'
          ),
      1400
    );

}


// =========================================
// API
// =========================================

async function api(
  path,
  options = {}
){

  const separator =
    path.includes('?')
      ?
      '&'
      :
      '?';


  const response =
    await fetch(

      '/api'
      +
      path
      +
      separator
      +
      'room='
      +
      encodeURIComponent(
        room
      ),

      {

        headers:{
          'content-type':
            'application/json',

          ...(
            options.headers
            ||
            {}
          )
        },

        ...options

      }

    );


  let result;


  try{

    result =
      await response.json();

  }

  catch(err){

    result = {
      ok:false,
      error:
        'Invalid server response'
    };

  }


  if (
    !response.ok
    &&
    !result.error
  ){

    result.error =
      'HTTP '
      +
      response.status;

  }


  return result;

}


// =========================================
// WEBSOCKET
// =========================================

function connect(){

  const protocol =
    location.protocol ===
      'https:'
      ?
      'wss:'
      :
      'ws:';


  ws =
    new WebSocket(

      protocol
      +
      '//'
      +
      location.host
      +
      '/api/ws?room='
      +
      encodeURIComponent(
        room
      )

    );


  ws.onopen =
    () => {

      $('conn').textContent =
        'live';

    };


  ws.onclose =
    () => {

      $('conn').textContent =
        'reconnecting…';


      setTimeout(
        connect,
        1200
      );

    };


  ws.onerror =
    () => {

      $('conn').textContent =
        'connection error';

    };


  ws.onmessage =
    event => {

      try{

        const message =
          JSON.parse(
            event.data
          );


        if (
          message.type ===
          'state'
        ){

          state =
            message.data;


          render();

        }

      }

      catch(err){

        console.error(
          err
        );

      }

    };

}


// =========================================
