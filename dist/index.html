<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Water Play</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="theme-color" content="#87CEEB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Water Play">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#0b1020;
  --card:#151c30;
  --card2:#1d2740;
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --accent2:#fb7185;
  --good:#34d399;
  --line:#28344f;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#0b1020,#111827);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  min-height:100vh;
}

.app{
  max-width:760px;
  margin:auto;
  padding:16px 14px 88px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.title{font-size:20px;font-weight:800}
.room{font-size:12px;color:var(--muted)}

.card{
  background:rgba(21,28,48,.96);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.22);
}

.date{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
  text-align:center;
}

.scoregrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.player{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  text-align:center;
}

.name{
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}

.score{
  font-size:58px;
  line-height:1;
  font-weight:900;
  margin:4px 0 14px;
}

.score-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.add{
  width:100%;
  border:0;
  border-radius:14px;
  padding:12px 6px;
  min-height:92px;
  font-weight:900;
  color:#04111b;
  background:var(--accent);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  touch-action:manipulation;
}

.player:nth-child(2) .add{
  background:var(--accent2);
}

.add:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.add-icon{
  width:34px;
  height:34px;
  display:block;
}

.add-icon svg{
  width:100%;
  height:100%;
  display:block;
}

.add-label{
  font-size:13px;
  font-weight:900;
}

.add-points{
  font-size:11px;
  opacity:.75;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.btn{
  border:1px solid var(--line);
  background:#0f172a;
  color:var(--text);
  border-radius:12px;
  padding:12px;
  font-weight:700;
  cursor:pointer;
}

.danger{
  border-color:#7f1d1d;
  color:#fecaca;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.metric{
  background:var(--card2);
  border-radius:14px;
  padding:14px;
}

.metric b{
  font-size:28px;
  display:block;
}

.metric span{
  font-size:12px;
  color:var(--muted);
}

.history-item{
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.history-item:last-child{border-bottom:0}

.chart-wrap{height:260px}

.seg{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.seg button{flex:1}

.seg .active{
  background:var(--accent);
  color:#06101c;
  border-color:transparent;
}

.settings label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:10px 0 5px;
}

.settings input{
  width:100%;
  background:#0f172a;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:12px;
  font-size:16px;
}

.nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(760px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(11,16,32,.97);
  border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right))
    calc(8px + env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
  z-index:10;
}

.nav button{
  background:none;
  border:0;
  color:var(--muted);
  font-size:11px;
  padding:8px 2px;
}

.nav button.active{
  color:var(--text);
  font-weight:800;
}

.view{display:none}
.view.active{display:block}

.status{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:#020617;
  color:#fff;
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50;
}

.toast.show{opacity:1}

@media(max-width:480px){
  .app{padding-left:10px;padding-right:10px}
  .score{font-size:48px}
  .player{padding:11px}
  .scoregrid{gap:8px}
  .add{min-height:88px;padding:10px 4px}
  .add-icon{width:30px;height:30px}
  .add-label{font-size:12px}
  .chart-wrap{height:230px}
}
</style>
</head>

<body>
<div class="app">

  <div class="top">
    <div>
      <div class="title">Duel Score</div>
      <div class="room" id="roomLabel"></div>
    </div>
    <div id="conn" class="room">connecting…</div>
  </div>

  <section id="today" class="view active">
    <div class="card">
      <div class="date" id="todayDate"></div>

      <div class="scoregrid">

        <div class="player">
          <div class="name" id="p1name">Player 1</div>
          <div class="score" id="p1score">0</div>

          <div class="score-actions">

            <button class="add" data-player="p1" data-points="1" aria-label="Add one point for a glass">
              <span class="add-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                  <path d="M16 10h32l-4 44H20L16 10Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                  <path d="M20 31c7 3 17-3 24 0l-2 19H22l-2-19Z" fill="currentColor" opacity=".35"/>
                  <path d="M18 19h28" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="add-label">Glass</span>
              <span class="add-points">+1 point</span>
            </button>

            <button class="add" data-player="p1" data-points="2" aria-label="Add two points for a bottle">
              <span class="add-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                  <path d="M26 6h12v9l5 7v31c0 3-2 5-5 5H26c-3 0-5-2-5-5V22l5-7V6Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                  <path d="M25 32h14v20H25V32Z" fill="currentColor" opacity=".35"/>
                  <path d="M26 14h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="add-label">Bottle</span>
              <span class="add-points">+2 points</span>
            </button>

          </div>
        </div>

        <div class="player">
          <div class="name" id="p2name">Player 2</div>
          <div class="score" id="p2score">0</div>

          <div class="score-actions">

            <button class="add" data-player="p2" data-points="1" aria-label="Add one point for a glass">
              <span class="add-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                  <path d="M16 10h32l-4 44H20L16 10Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                  <path d="M20 31c7 3 17-3 24 0l-2 19H22l-2-19Z" fill="currentColor" opacity=".35"/>
                  <path d="M18 19h28" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="add-label">Glass</span>
              <span class="add-points">+1 point</span>
            </button>

            <button class="add" data-player="p2" data-points="2" aria-label="Add two points for a bottle">
              <span class="add-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                  <path d="M26 6h12v9l5 7v31c0 3-2 5-5 5H26c-3 0-5-2-5-5V22l5-7V6Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                  <path d="M25 32h14v20H25V32Z" fill="currentColor" opacity=".35"/>
                  <path d="M26 14h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="add-label">Bottle</span>
              <span class="add-points">+2 points</span>
            </button>

          </div>
        </div>

      </div>

      <div class="actions">
        <button class="btn" id="undoBtn">Undo last point</button>
        <button class="btn danger" id="closeBtn">Close day</button>
      </div>

      <div class="status" id="lastPoint">No points yet today.</div>
    </div>
  </section>

  <section id="general" class="view">
    <div class="card">
      <h3>Overall score</h3>

      <div class="summary">
        <div class="metric">
          <b id="p1total">0</b>
          <span id="p1totalLabel">Player 1 total points</span>
        </div>

        <div class="metric">
          <b id="p2total">0</b>
          <span id="p2totalLabel">Player 2 total points</span>
        </div>

        <div class="metric">
          <b id="p1wins">0</b>
          <span id="p1winsLabel">Days won</span>
        </div>

        <div class="metric">
          <b id="p2wins">0</b>
          <span id="p2winsLabel">Days won</span>
        </div>
      </div>
    </div>
  </section>

  <section id="history" class="view">
    <div class="card">
      <h3>History</h3>
      <div id="historyList"></div>
    </div>
  </section>

  <section id="charts" class="view">
    <div class="card">
      <div class="seg">
        <button class="btn active" id="weekBtn">Weekly</button>
        <button class="btn" id="monthBtn">Monthly</button>
      </div>

      <div class="chart-wrap">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>
  </section>

  <section id="settings" class="view">
    <div class="card settings">
      <h3>Settings</h3>

      <label>Player 1 name</label>
      <input id="p1input" maxlength="30">

      <label>Player 2 name</label>
      <input id="p2input" maxlength="30">

      <button class="btn" id="saveSettings" style="width:100%;margin-top:12px;">
        Save names
      </button>
    </div>
  </section>

</div>

<nav class="nav">
  <button class="active" data-view="today">Today</button>
  <button data-view="general">General</button>
  <button data-view="history">History</button>
  <button data-view="charts">Charts</button>
  <button data-view="settings">Settings</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const params =
  new URLSearchParams(
    location.search
  );

const room =
  params.get('room')
  ||
  localStorage.getItem(
    'duel_room'
  )
  ||
  'JarAna';

localStorage.setItem(
  'duel_room',
  room
);

document
  .getElementById(
    'roomLabel'
  )
  .textContent =
    'Room: ' + room;

let state = null;
let ws = null;
let chart = null;
let chartMode = 'week';

const $ =
  id =>
    document.getElementById(
      id
    );

function toast(text){
  $('toast').textContent =
    text;

  $('toast')
    .classList
    .add(
      'show'
    );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        $('toast')
          .classList
          .remove(
            'show'
          ),
      1400
    );
}

async function api(
  path,
  options = {}
){
  const separator =
    path.includes('?')
      ? '&'
      : '?';

  const response =
    await fetch(
      '/api'
      +
      path
      +
      separator
      +
      'room='
      +
      encodeURIComponent(
        room
      ),
      {
        headers:{
          'content-type':
            'application/json',
          ...(
            options.headers
            ||
            {}
          )
        },
        ...options
      }
    );

  return response.json();
}

function connect(){
  const protocol =
    location.protocol === 'https:'
      ? 'wss:'
      : 'ws:';

  ws =
    new WebSocket(
      protocol
      +
      '//'
      +
      location.host
      +
      '/api/ws?room='
      +
      encodeURIComponent(
        room
      )
    );

  ws.onopen =
    () => {
      $('conn').textContent =
        'live';
    };

  ws.onclose =
    () => {
      $('conn').textContent =
        'reconnecting…';

      setTimeout(
        connect,
        1200
      );
    };

  ws.onmessage =
    event => {
      const message =
        JSON.parse(
          event.data
        );

      if (
        message.type ===
        'state'
      ){
        state =
          message.data;

        render();
      }
    };
}

function fmtDate(date){
  try{
    return new Date(
      date + 'T12:00:00'
    )
      .toLocaleDateString(
        undefined,
        {
          weekday:'long',
          day:'numeric',
          month:'short'
        }
      );
  }
  catch{
    return date;
  }
}

function totals(){
  const days =
    [
      ...(state?.history || []),
      state?.today
    ]
      .filter(Boolean);

  let p1 = 0;
  let p2 = 0;
  let w1 = 0;
  let w2 = 0;

  for (
    const day
    of
    days
  ){
    const a =
      day.scores?.p1
      ||
      0;

    const b =
      day.scores?.p2
      ||
      0;

    p1 += a;
    p2 += b;

    if (
      day !==
      state.today
    ){
      if (a > b){
        w1++;
      }
      else if (b > a){
        w2++;
      }
    }
  }

  return {
    p1,
    p2,
    w1,
    w2
  };
}

function render(){
  if (!state){
    return;
  }

  const name1 =
    state.players[0].name;

  const name2 =
    state.players[1].name;

  $('p1name').textContent =
    name1;

  $('p2name').textContent =
    name2;

  $('p1score').textContent =
    state.today.scores.p1;

  $('p2score').textContent =
    state.today.scores.p2;

  $('todayDate').textContent =
    fmtDate(
      state.today.date
    );

  $('p1input').value =
    name1;

  $('p2input').value =
    name2;

  const last =
    state.today.events[
      state.today.events.length - 1
    ];

  if (last){
    const lastName =
      last.playerId === 'p1'
        ? name1
        : name2;

    const lastPoints =
      Number(
        last.points
      )
      ||
      1;

    $('lastPoint').textContent =
      'Last: '
      +
      lastName
      +
      ' +'
      +
      lastPoints
      +
      ' · '
      +
      new Date(
        last.at
      )
        .toLocaleTimeString(
          [],
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        );
  }
  else{
    $('lastPoint').textContent =
      'No points yet today.';
  }

  const total =
    totals();

  $('p1total').textContent =
    total.p1;

  $('p2total').textContent =
    total.p2;

  $('p1wins').textContent =
    total.w1;

  $('p2wins').textContent =
    total.w2;

  $('p1totalLabel').textContent =
    name1
    +
    ' total points';

  $('p2totalLabel').textContent =
    name2
    +
    ' total points';

  $('p1winsLabel').textContent =
    name1
    +
    ' days won';

  $('p2winsLabel').textContent =
    name2
    +
    ' days won';

  renderHistory();
  renderChart();
}

function renderHistory(){
  const history =
    [...(state.history || [])]
      .reverse();

  $('historyList').innerHTML =
    history.length
      ? ''
      : '<div class="room">No closed days yet.</div>';

  for (
    const day
    of
    history
  ){
    const p1 =
      day.scores.p1
      ||
      0;

    const p2 =
      day.scores.p2
      ||
      0;

    const winner =
      p1 === p2
        ? 'Tie'
        : (
          p1 > p2
            ? state.players[0].name
            : state.players[1].name
        );

    const div =
      document.createElement(
        'div'
      );

    div.className =
      'history-item';

    div.innerHTML =
      `
        <div>
          <b>${fmtDate(day.date)}</b>
          <div class="room">
            Winner: ${winner}
          </div>
        </div>

        <div>
          <b>${p1} - ${p2}</b>
        </div>
      `;

    $('historyList')
      .appendChild(
        div
      );
  }
}

function chartRows(){
  const all =
    [
      ...(state.history || []),
      state.today
    ];

  const now =
    new Date();

  if (
    chartMode ===
    'week'
  ){
    const cutoff =
      new Date(
        now
      );

    cutoff.setHours(
      0,
      0,
      0,
      0
    );

    cutoff.setDate(
      cutoff.getDate() - 6
    );

    return all
      .filter(
        day =>
          new Date(
            day.date
            +
            'T12:00:00'
          )
          >=
          cutoff
      )
      .map(
        day => ({
          label:
            new Date(
              day.date
              +
              'T12:00:00'
            )
              .toLocaleDateString(
                [],
                {
                  weekday:'short'
                }
              ),
          p1:
            day.scores.p1
            ||
            0,
          p2:
            day.scores.p2
            ||
            0
        })
      );
  }

  const map =
    new Map();

  for (
    const day
    of
    all
  ){
    const key =
      day.date.slice(
        0,
        7
      );

    if (
      !map.has(
        key
      )
    ){
      map.set(
        key,
        {
          label:
            new Date(
              key
              +
              '-01T12:00:00'
            )
              .toLocaleDateString(
                [],
                {
                  month:'short'
                }
              ),
          p1:0,
          p2:0
        }
      );
    }

    const entry =
      map.get(
        key
      );

    entry.p1 +=
      day.scores.p1
      ||
      0;

    entry.p2 +=
      day.scores.p2
      ||
      0;
  }

  return [
    ...map.values()
  ]
    .slice(
      -6
    );
}

function renderChart(){
  if (
    !state
    ||
    !$('scoreChart')
  ){
    return;
  }

  const rows =
    chartRows();

  const data = {
    labels:
      rows.map(
        row => row.label
      ),
    datasets:[
      {
        label:
          state.players[0].name,
        data:
          rows.map(
            row => row.p1
          )
      },
      {
        label:
          state.players[1].name,
        data:
          rows.map(
            row => row.p2
          )
      }
    ]
  };

  if (chart){
    chart.destroy();
  }

  chart =
    new Chart(
      $('scoreChart'),
      {
        type:'line',
        data,
        options:{
          responsive:true,
          maintainAspectRatio:false,
          plugins:{
            legend:{
              labels:{
                color:'#e2e8f0'
              }
            }
          },
          scales:{
            x:{
              ticks:{
                color:'#94a3b8'
              },
              grid:{
                color:'#24304a'
              }
            },
            y:{
              beginAtZero:true,
              ticks:{
                precision:0,
                color:'#94a3b8'
              },
              grid:{
                color:'#24304a'
              }
            }
          }
        }
      }
    );
}

// =========================================
// POINT BUTTONS
//
// Glass  = +1
// Bottle = +2
// =========================================

document
  .querySelectorAll(
    '.add'
  )
  .forEach(
    button => {
      button.onclick =
        async () => {
          button.disabled =
            tr
